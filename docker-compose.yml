version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ibsdiettracker:ibsdiettracker@db:5432/ibsdiettracker
      - SECRET_KEY=dev-secret-key-change-in-production
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=ibsdiettracker
      - POSTGRES_PASSWORD=ibsdiettracker
      - POSTGRES_DB=ibsdiettracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibsdiettracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
